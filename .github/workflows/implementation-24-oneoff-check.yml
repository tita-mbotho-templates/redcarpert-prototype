name: One-off Implementation 24 merge verification
on:
  push:
    branches:
      - implementation/24-centralized-image-links
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tita-mbotho-templates/redcarpert-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
